<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<title>Pixel Chat Room</title>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<style>

body {
    margin: 0;
    overflow: hidden;
}

#mobile-controls {

    position: fixed;

    bottom: 20px;
    left: 20px;

    z-index: 999;
}

#mobile-controls button {

    width: 60px;
    height: 60px;

    font-size: 24px;

    margin: 5px;

    border: none;

    border-radius: 12px;

    background: rgba(0,0,0,0.6);

    color: white;
}

</style>

</head>

<body>

<div id="mobile-controls">

    <button id="up">↑</button>

    <div>
        <button id="left">←</button>
        <button id="down">↓</button>
        <button id="right">→</button>
    </div>

</div>

<script>

const socket = io();

const playerName = prompt("名前を入力");

const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: "#111111",
    pixelArt: true,

    scene: {
        preload,
        create,
        update
    }
};

const game = new Phaser.Game(config);

let player;
let playerText;

let cursors;
let wasd;

let otherPlayers = {};
let nameTexts = {};

let targetX = null;
let targetY = null;

let chatBubble = null;

let mobileMove = {
    up: false,
    down: false,
    left: false,
    right: false
};

function preload() {

    this.load.image(
        "player",
        "images/player.png"
    );

    this.load.image(
        "room",
        "images/room.png"
    );
}

function create() {

    this.add.image(400, 300, "room")
        .setScale(0.5);

    player = this.add.image(
        400,
        300,
        "player"
    );

    player.setScale(0.3);

    playerText = this.add.text(
        player.x - 20,
        player.y - 50,
        playerName,
        {
            fontSize: "16px",
            color: "#00ffff"
        }
    );

    cursors = this.input.keyboard.createCursorKeys();

    wasd = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W,
        left: Phaser.Input.Keyboard.KeyCodes.A,
        down: Phaser.Input.Keyboard.KeyCodes.S,
        right: Phaser.Input.Keyboard.KeyCodes.D
    });

    socket.on("players", (players) => {

        for (let id in otherPlayers) {

            otherPlayers[id].destroy();

            if (nameTexts[id]) {
                nameTexts[id].destroy();
            }
        }

        otherPlayers = {};
        nameTexts = {};

        for (let id in players) {

            if (id === socket.id) continue;

            let p = players[id];

            otherPlayers[id] = this.add.image(
                p.x,
                p.y,
                "player"
            );

            otherPlayers[id].setScale(0.3);

            otherPlayers[id].flipX = p.flipX;

            nameTexts[id] = this.add.text(
                p.x - 20,
                p.y - 50,
                p.name || "Player",
                {
                    fontSize: "16px",
                    color: "#ffffff"
                }
            );
        }
    });

    window.addEventListener("keydown", (event) => {

        if (event.key === "Enter") {

            let message = prompt("メッセージ");

            if (message) {

                socket.emit("chat", message);
            }
        }
    });

    socket.on("chat", (data) => {

        if (chatBubble) {
            chatBubble.destroy();
        }

        chatBubble = this.add.text(
            player.x - 20,
            player.y - 80,
            data.message,
            {
                fontSize: "20px",
                color: "#ffffff",
                backgroundColor: "#000000",
                padding: {
                    x: 8,
                    y: 4
                }
            }
        );

        setTimeout(() => {

            if (chatBubble) {
                chatBubble.destroy();
                chatBubble = null;
            }

        }, 3000);
    });

    this.input.on("pointerdown", (pointer) => {

        targetX = pointer.x;
        targetY = pointer.y;
    });

    const setupButton = (id, direction) => {

        const button = document.getElementById(id);

        button.addEventListener("touchstart", () => {
            mobileMove[direction] = true;
        });

        button.addEventListener("touchend", () => {
            mobileMove[direction] = false;
        });

        button.addEventListener("mousedown", () => {
            mobileMove[direction] = true;
        });

        button.addEventListener("mouseup", () => {
            mobileMove[direction] = false;
        });
    };

    setupButton("up", "up");
    setupButton("down", "down");
    setupButton("left", "left");
    setupButton("right", "right");
}

function update() {

    if (
        cursors.left.isDown ||
        wasd.left.isDown ||
        mobileMove.left
    ) {

        player.x -= 4;

        player.flipX = true;
    }

    if (
        cursors.right.isDown ||
        wasd.right.isDown ||
        mobileMove.right
    ) {

        player.x += 4;

        player.flipX = false;
    }

    if (
        cursors.up.isDown ||
        wasd.up.isDown ||
        mobileMove.up
    ) {

        player.y -= 4;
    }

    if (
        cursors.down.isDown ||
        wasd.down.isDown ||
        mobileMove.down
    ) {

        player.y += 4;
    }

    if (targetX !== null && targetY !== null) {

        if (player.x < targetX) {
            player.x += 3;
            player.flipX = false;
        }

        if (player.x > targetX) {
            player.x -= 3;
            player.flipX = true;
        }

        if (player.y < targetY) {
            player.y += 3;
        }

        if (player.y > targetY) {
            player.y -= 3;
        }
    }

    playerText.x = player.x - 20;
    playerText.y = player.y - 50;

    if (chatBubble) {

        chatBubble.x = player.x - 20;
        chatBubble.y = player.y - 80;
    }

    socket.emit("move", {
        x: player.x,
        y: player.y,
        name: playerName,
        flipX: player.flipX
    });
}

</script>

</body>
</html>
